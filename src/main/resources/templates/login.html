<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng nhập')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-5" style="max-width:420px">
    <h3 class="mb-3">Đăng nhập</h3>
    <div th:if="${param.error}" class="alert alert-danger">Sai email hoặc mật khẩu</div>
    <div th:if="${param.registered}" class="alert alert-success">Đăng ký thành công, hãy đăng nhập</div>
    <form th:action="@{/login}" method="post">
        <input class="form-control mb-3" type="email" name="username" placeholder="Email" required>
        <input class="form-control mb-3" type="password" name="password" placeholder="Mật khẩu" required>
        <button class="btn btn-primary w-100">Đăng nhập</button>
    </form>
</div>
</body>
</html>
