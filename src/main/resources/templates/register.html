<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng ký')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-5" style="max-width:420px">
    <h3 class="mb-3">Đăng ký</h3>
    <form th:action="@{/register}" th:object="${form}" method="post">
        <div class="mb-3">
            <input class="form-control" th:field="*{fullName}" placeholder="Họ tên">
            <div class="text-danger small" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3">
            <input class="form-control" th:field="*{email}" placeholder="Email">
            <div class="text-danger small" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <input class="form-control" th:field="*{phone}" placeholder="Số điện thoại">
            <div class="text-danger small" th:errors="*{phone}"></div>
        </div>
        <div class="mb-3">
            <input class="form-control" type="password" th:field="*{password}" placeholder="Mật khẩu">
            <div class="text-danger small" th:errors="*{password}"></div>
        </div>
        <button class="btn btn-success w-100">Đăng ký</button>
    </form>
</div>
</body>
</html>
