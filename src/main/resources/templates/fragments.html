<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">DrinkBooking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background:
                    linear-gradient(rgba(255,255,255,.25), rgba(255,255,255,.25)),
                    url('/images/bg.jpg') center/cover fixed,
                    linear-gradient(135deg, #fdf3e7, #f1dcc0) fixed;
        }
        body > .container {
            background: rgba(255,255,255,.93);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }
        @media (min-width: 1500px) {
            body::before, body::after {
                content: "";
                position: fixed;
                top: 80px;
                bottom: 20px;
                width: calc((100vw - 1320px) / 2 - 24px);
                border-radius: 16px;
                box-shadow: 0 4px 20px rgba(0,0,0,.15);
            }
            body::before {
                left: 12px;
                background: url('/images/banner-left.jpg') center/cover,
                linear-gradient(160deg, #6f4e37, #c08457);
            }
            body::after {
                right: 12px;
                background: url('/images/banner-right.jpg') center/cover,
                linear-gradient(160deg, #1f7a8c, #6dc5b8);
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('input[type="password"]').forEach(function (input) {
                var wrap = document.createElement('div');
                wrap.className = 'position-relative';
                ['mb-1', 'mb-2', 'mb-3', 'mb-4'].forEach(function (c) {
                    if (input.classList.contains(c)) {
                        input.classList.remove(c);
                        wrap.classList.add(c);
                    }
                });
                input.parentNode.insertBefore(wrap, input);
                wrap.appendChild(input);
                input.style.paddingRight = '4rem';
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = 'Hiện';
                btn.className = 'btn btn-link btn-sm text-secondary text-decoration-none position-absolute top-0 end-0 h-100 px-3';
                btn.addEventListener('click', function () {
                    var show = input.type === 'password';
                    input.type = show ? 'text' : 'password';
                    btn.textContent = show ? 'Ẩn' : 'Hiện';
                });
                wrap.appendChild(btn);
            });
        });
    </script>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-dark bg-dark">
    <div class="container d-flex flex-wrap gap-2">
        <a class="navbar-brand" th:href="@{/}">☕ DrinkBooking</a>
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <a class="btn btn-sm btn-outline-light" th:href="@{/menu}">Thực đơn</a>
            <a sec:authorize="isAuthenticated()" class="btn btn-sm btn-outline-light" th:href="@{/cart}">
                Giỏ hàng
                <span class="badge bg-danger" th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}"></span>
            </a>
            <a sec:authorize="isAuthenticated()" class="btn btn-sm btn-outline-light" th:href="@{/orders/my}">Đơn của tôi</a>
            <a sec:authorize="hasRole('ADMIN')" class="btn btn-sm btn-warning" th:href="@{/admin/dashboard}">Admin</a>
            <a sec:authorize="hasAnyRole('STAFF','ADMIN')" class="btn btn-sm btn-info" th:href="@{/staff/schedule}">Đơn được giao</a>
            <a sec:authorize="isAuthenticated()" class="btn btn-sm btn-outline-light" th:href="@{/profile}">Cá nhân</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-sm btn-danger">Đăng xuất</button>
            </form>
            <a sec:authorize="!isAuthenticated()" class="btn btn-sm btn-outline-light" th:href="@{/login}">Đăng nhập</a>
            <a sec:authorize="!isAuthenticated()" class="btn btn-sm btn-success" th:href="@{/register}">Đăng ký</a>
        </div>
    </div>
</nav>
</body>
</html>
