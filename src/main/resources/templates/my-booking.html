<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đơn của tôi')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">Đơn của tôi</h3>
        <a class="btn btn-success" th:href="@{/menu}">+ Đặt thêm</a>
    </div>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr><th>Đơn</th><th>Món</th><th>Giao</th><th>Tổng</th><th>Trạng thái</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookings}">
                <td>
                    <div th:text="'#' + ${b.id}"></div>
                    <div class="small text-muted" th:text="${#temporals.format(b.createdAt, 'dd/MM/yyyy HH:mm')}"></div>
                    <span class="badge bg-warning text-dark" th:if="${b.largeOrder}">Đơn lớn</span>
                    <span class="badge bg-light text-dark border" th:unless="${b.largeOrder}">Đơn thường</span>
                </td>
                <td>
                    <div th:text="${b.summary}"></div>
                    <div class="small text-muted" th:text="'Giao tới: ' + ${b.address}"></div>
                    <div class="small text-muted" th:if="${b.note != null and !#strings.isEmpty(b.note)}"
                         th:text="'Ghi chú: ' + ${b.note}"></div>
                </td>
                <td>
                    <div th:if="${b.largeOrder and b.bookingTime != null}"
                         th:text="${#temporals.format(b.bookingTime, 'dd/MM/yyyy HH:mm')}"></div>
                    <div th:unless="${b.largeOrder and b.bookingTime != null}">Cửa hàng báo sau</div>
                    <div class="small text-muted" th:if="${b.staff != null}"
                         th:text="(${b.largeOrder} ? 'Trưởng đội: ' : 'Nhân viên: ') + ${b.staff.fullName}"></div>
                </td>
                <td>
                    <div th:text="${b.totalCups} + ' ly'"></div>
                    <strong th:text="${#numbers.formatInteger(b.totalPrice, 0, 'POINT')} + ' đ'"></strong>
                </td>
                <td><span class="badge" th:classappend="${b.status.badge}" th:text="${b.status.label}"></span></td>
                <td>
                    <form th:if="${b.cancellable}" th:action="@{/orders/{id}/cancel(id=${b.id})}" method="post"
                          onsubmit="return confirm('Hủy đơn này?')">
                        <button class="btn btn-sm btn-danger">Hủy đơn</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(bookings)}">
                <td colspan="6" class="text-center">Bạn chưa có đơn nào</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
