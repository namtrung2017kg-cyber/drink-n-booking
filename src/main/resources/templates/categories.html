<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Loại đồ uống')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">Loại đồ uống</h3>
        <a class="btn btn-success" th:href="@{/admin/categories/new}">+ Thêm loại</a>
    </div>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr><th>#</th><th>Tên loại</th><th>Mô tả</th><th style="width:170px">Thao tác</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${categories}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.name}"></td>
                <td th:text="${c.description}"></td>
                <td>
                    <a class="btn btn-sm btn-primary" th:href="@{/admin/categories/{id}/edit(id=${c.id})}">Sửa</a>
                    <form class="d-inline" th:action="@{/admin/categories/{id}/delete(id=${c.id})}"
                          method="post" onsubmit="return confirm('Xóa loại này?')">
                        <button class="btn btn-sm btn-danger">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="4" class="text-center">Chưa có loại nào</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
