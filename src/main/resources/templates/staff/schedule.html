<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đơn được giao')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-4">
    <h3 class="mb-3">Đơn được giao cho tôi</h3>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <h5 class="mt-4">Cần thực hiện</h5>
    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr><th>Giao</th><th>Khách</th><th>Món</th><th>Trạng thái</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="b : ${todo}">
                <td>
                    <div th:if="${b.largeOrder and b.bookingTime != null}"
                         th:text="${#temporals.format(b.bookingTime, 'dd/MM/yyyy HH:mm')}"></div>
                    <div th:unless="${b.largeOrder and b.bookingTime != null}" class="text-muted">Giao khi xong</div>
                    <span class="badge bg-warning text-dark" th:if="${b.largeOrder}">Đơn lớn, bạn là trưởng đội</span>
                </td>
                <td>
                    <div th:text="${b.customer.fullName}"></div>
                    <div class="small text-muted" th:text="${b.phone}"></div>
                    <div class="small text-muted" th:text="${b.address}"></div>
                </td>
                <td>
                    <div th:text="${b.totalCups} + ' ly'"></div>
                    <div class="small text-muted" th:text="${b.summary}"></div>
                    <div class="small text-muted" th:if="${b.note != null and !#strings.isEmpty(b.note)}"
                         th:text="'Ghi chú: ' + ${b.note}"></div>
                </td>
                <td><span class="badge" th:classappend="${b.status.badge}" th:text="${b.status.label}"></span></td>
                <td>
                    <form th:if="${b.status.name() == 'CONFIRMED'}"
                          th:action="@{/staff/bookings/{id}/status(id=${b.id})}" method="post">
                        <input type="hidden" name="to" value="IN_PROGRESS">
                        <button class="btn btn-sm btn-warning">Bắt đầu</button>
                    </form>
                    <form th:if="${b.status.name() == 'IN_PROGRESS'}"
                          th:action="@{/staff/bookings/{id}/status(id=${b.id})}" method="post">
                        <input type="hidden" name="to" value="COMPLETED">
                        <button class="btn btn-sm btn-success">Hoàn thành</button>
                    </form>
                    <span th:if="${b.status.name() == 'NEW'}" class="small text-muted">Chờ admin xác nhận</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(todo)}">
                <td colspan="5" class="text-center">Không có đơn nào cần thực hiện</td>
            </tr>
            </tbody>
        </table>
    </div>

    <h5 class="mt-4">Đã hoàn thành</h5>
    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr><th>Đơn</th><th>Khách</th><th>Món</th><th>Tổng tiền</th></tr>
            </thead>
            <tbody>
            <tr th:each="b : ${done}">
                <td th:text="'#' + ${b.id}"></td>
                <td th:text="${b.customer.fullName}"></td>
                <td th:text="${b.summary}"></td>
                <td th:text="${#numbers.formatInteger(b.totalPrice, 0, 'POINT')} + ' đ'"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(done)}">
                <td colspan="4" class="text-center">Chưa có đơn nào hoàn thành</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
