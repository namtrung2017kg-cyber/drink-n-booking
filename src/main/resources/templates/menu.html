<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Thực đơn')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-4">
    <h3 class="mb-3">Thực đơn</h3>

    <form class="row g-2 mb-4" th:action="@{/menu}" method="get">
        <div class="col-12 col-md-5">
            <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm đồ uống...">
        </div>
        <div class="col-8 col-md-4">
            <select class="form-select" name="categoryId">
                <option value="">Tất cả loại</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${c.id == categoryId}"></option>
            </select>
        </div>
        <div class="col-4 col-md-3">
            <button class="btn btn-primary w-100">Tìm</button>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3">
        <div class="col" th:each="d : ${drinks.content}">
            <div class="card h-100">
                <img th:if="${d.imageUrl != null and !#strings.isEmpty(d.imageUrl)}" th:src="${d.imageUrl}"
                     class="card-img-top" alt="" style="height:180px;object-fit:cover">
                <div class="card-body">
                    <span class="badge bg-info text-dark mb-2" th:text="${d.category.name}"></span>
                    <h5 class="card-title" th:text="${d.name}"></h5>
                    <p class="card-text text-muted" th:text="${d.description}"></p>
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center">
                    <strong th:text="${#numbers.formatInteger(d.price, 0, 'POINT')} + ' đ'"></strong>
                    <a class="btn btn-sm btn-primary" th:href="@{/menu/{id}(id=${d.id})}">Xem chi tiết</a>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${drinks.empty}" class="text-center text-muted mt-4">Không tìm thấy đồ uống phù hợp</p>

    <nav class="mt-4" th:if="${drinks.totalPages > 1}">
        <ul class="pagination flex-wrap">
            <li class="page-item" th:classappend="${drinks.first} ? 'disabled'">
                <a class="page-link" th:href="@{/menu(keyword=${keyword},categoryId=${categoryId},page=${drinks.number - 1})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, drinks.totalPages - 1)}"
                th:classappend="${i == drinks.number} ? 'active'">
                <a class="page-link" th:href="@{/menu(keyword=${keyword},categoryId=${categoryId},page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${drinks.last} ? 'disabled'">
                <a class="page-link" th:href="@{/menu(keyword=${keyword},categoryId=${categoryId},page=${drinks.number + 1})}">»</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
