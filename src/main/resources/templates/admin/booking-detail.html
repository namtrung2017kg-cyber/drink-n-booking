<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Chi tiết đơn')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-4" style="max-width:760px">
    <a class="btn btn-outline-secondary btn-sm mb-3" th:href="@{/admin/orders}">← Danh sách đơn</a>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="m-0">
                    <span th:text="'Đơn #' + ${booking.id}"></span>
                    <span class="badge bg-warning text-dark fs-6" th:if="${booking.largeOrder}">Đơn lớn</span>
                </h4>
                <span class="badge fs-6" th:classappend="${booking.status.badge}" th:text="${booking.statusLabel}"></span>
            </div>
            <dl class="row mb-0">
                <dt class="col-5 col-sm-3">Khách hàng</dt>
                <dd class="col-7 col-sm-9" th:text="${booking.customer.fullName} + ' (' + ${booking.customer.email} + ')'"></dd>
                <dt class="col-5 col-sm-3">SĐT nhận hàng</dt>
                <dd class="col-7 col-sm-9" th:text="${booking.phone}"></dd>
                <dt class="col-5 col-sm-3">Địa chỉ giao</dt>
                <dd class="col-7 col-sm-9" th:text="${booking.address}"></dd>
                <dt class="col-5 col-sm-3">Giờ giao</dt>
                <dd class="col-7 col-sm-9"
                    th:text="${booking.largeOrder and booking.bookingTime != null} ? ${#temporals.format(booking.bookingTime, 'dd/MM/yyyy HH:mm')} : 'Cửa hàng sẽ báo sau'"></dd>
                <dt class="col-5 col-sm-3" th:text="${booking.largeOrder} ? 'Trưởng đội' : 'Người phụ trách'"></dt>
                <dd class="col-7 col-sm-9"
                    th:text="${booking.staff != null} ? ${booking.staff.fullName} : (${booking.largeOrder} ? 'Chưa chỉ định' : 'Chưa có người nhận')"></dd>
                <dt class="col-5 col-sm-3">Ghi chú</dt>
                <dd class="col-7 col-sm-9" th:text="${booking.note}"></dd>
                <dt class="col-5 col-sm-3">Ngày đặt</dt>
                <dd class="col-7 col-sm-9" th:text="${#temporals.format(booking.createdAt, 'dd/MM/yyyy HH:mm')}"></dd>
            </dl>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h6>Các món trong đơn</h6>
            <div class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead class="table-light">
                    <tr><th>Đồ uống</th><th class="text-end">Đơn giá</th><th class="text-end">SL</th><th class="text-end">Thành tiền</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="it : ${booking.items}">
                        <td th:text="${it.drink.name}"></td>
                        <td class="text-end" th:text="${#numbers.formatInteger(it.unitPrice, 0, 'POINT')} + ' đ'"></td>
                        <td class="text-end" th:text="${it.quantity}"></td>
                        <td class="text-end" th:text="${#numbers.formatInteger(it.lineTotal, 0, 'POINT')} + ' đ'"></td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <th>Tổng cộng</th>
                        <th></th>
                        <th class="text-end" th:text="${booking.totalCups}"></th>
                        <th class="text-end text-success" th:text="${#numbers.formatInteger(booking.totalPrice, 0, 'POINT')} + ' đ'"></th>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <div class="card mb-3"
         th:if="${(booking.largeOrder and (booking.status.name() == 'NEW' or booking.status.name() == 'CONFIRMED'))
                  or (!booking.largeOrder and (booking.status.name() == 'NEW' or booking.status.name() == 'CONFIRMED' or booking.status.name() == 'IN_PROGRESS'))}">
        <div class="card-body">
            <h6 th:text="${booking.largeOrder} ? 'Chỉ định trưởng đội' : 'Đổi người phụ trách'"></h6>
            <form class="row g-2" th:action="@{/admin/orders/{id}/assign(id=${booking.id})}" method="post">
                <div class="col-8">
                    <select class="form-select" name="staffId">
                        <option value="">-- Chưa có --</option>
                        <option th:each="s : ${staffList}" th:value="${s.id}" th:text="${s.fullName}"
                                th:selected="${booking.staff != null and booking.staff.id == s.id}"></option>
                    </select>
                </div>
                <div class="col-4">
                    <button class="btn btn-primary w-100">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card" th:if="${!#maps.isEmpty(actions)}">
        <div class="card-body">
            <h6>Thao tác</h6>
            <div class="d-flex flex-wrap gap-2">
                <form th:each="a : ${actions}" th:action="@{/admin/orders/{id}/status(id=${booking.id})}" method="post">
                    <input type="hidden" name="to" th:value="${a.key}">
                    <button class="btn"
                            th:classappend="${a.key.name() == 'CANCELLED'} ? 'btn-outline-danger' : 'btn-outline-primary'"
                            th:text="${a.value}"></button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
