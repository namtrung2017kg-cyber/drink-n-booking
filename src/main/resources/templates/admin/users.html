<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Tài khoản')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">Tài khoản và nhân viên</h3>
        <a class="btn btn-success" th:href="@{/admin/users/new}">+ Thêm tài khoản</a>
    </div>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form class="row g-2 mb-3" th:action="@{/admin/users}" method="get">
        <div class="col-12 col-md-5">
            <input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tìm theo tên hoặc email...">
        </div>
        <div class="col-8 col-md-4">
            <select class="form-select" name="role">
                <option value="">Tất cả vai trò</option>
                <option th:each="r : ${roles}" th:value="${r}"
                        th:text="${r.name() == 'ADMIN' ? 'Quản trị viên' : (r.name() == 'STAFF' ? 'Nhân viên' : 'Khách hàng')}"
                        th:selected="${r == role}"></option>
            </select>
        </div>
        <div class="col-4 col-md-3">
            <button class="btn btn-primary w-100">Tìm</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr><th>STT</th><th>Họ tên</th><th>Email</th><th>SĐT</th><th>Vai trò</th><th>Trạng thái</th><th style="width:230px">Thao tác</th></tr>
            </thead>
            <tbody>
            <tr th:each="u, stat : ${users.content}">
                <td th:text="${users.number * users.size + stat.count}"></td>
                <td th:text="${u.fullName}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.phone}"></td>
                <td th:text="${u.role.name() == 'ADMIN' ? 'Quản trị viên' : (u.role.name() == 'STAFF' ? 'Nhân viên' : 'Khách hàng')}"></td>
                <td>
                    <span th:if="${u.enabled}" class="badge bg-success">Hoạt động</span>
                    <span th:unless="${u.enabled}" class="badge bg-secondary">Đã khóa</span>
                </td>
                <td>
                    <a class="btn btn-sm btn-primary" th:href="@{/admin/users/{id}/edit(id=${u.id})}">Sửa</a>
                    <form class="d-inline" th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                        <button class="btn btn-sm btn-warning" th:text="${u.enabled} ? 'Khóa' : 'Mở khóa'"></button>
                    </form>
                    <form class="d-inline" th:action="@{/admin/users/{id}/delete(id=${u.id})}"
                          method="post" onsubmit="return confirm('Xóa tài khoản này?')">
                        <button class="btn btn-sm btn-danger">Xóa</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.empty}">
                <td colspan="7" class="text-center">Không có tài khoản nào</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${users.totalPages > 1}">
        <ul class="pagination flex-wrap">
            <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/users(keyword=${keyword},role=${role},page=${users.number - 1})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                th:classappend="${i == users.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/users(keyword=${keyword},role=${role},page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/users(keyword=${keyword},role=${role},page=${users.number + 1})}">»</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
