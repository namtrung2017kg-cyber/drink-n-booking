<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Tài khoản')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-4" style="max-width:560px">
    <h3 class="mb-3" th:text="${form.id == null} ? 'Thêm tài khoản' : 'Sửa tài khoản'"></h3>
    <form th:action="@{/admin/users/save}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label">Họ tên</label>
            <input class="form-control" th:field="*{fullName}">
            <div class="text-danger small" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" th:field="*{email}" th:readonly="${form.id != null}">
            <div class="text-danger small" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input class="form-control" th:field="*{phone}">
            <div class="text-danger small" th:errors="*{phone}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Vai trò</label>
            <select class="form-select" th:field="*{role}">
                <option th:each="r : ${roles}" th:value="${r}"
                        th:text="${r.name() == 'ADMIN' ? 'Quản trị viên' : (r.name() == 'STAFF' ? 'Nhân viên' : 'Khách hàng')}"></option>
            </select>
            <div class="text-danger small" th:errors="*{role}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:text="${form.id == null} ? 'Mật khẩu' : 'Mật khẩu mới (để trống nếu không đổi)'"></label>
            <input class="form-control" type="password" th:field="*{password}">
            <div class="text-danger small" th:errors="*{password}"></div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{enabled}" id="enabled">
            <label class="form-check-label" for="enabled">Đang hoạt động</label>
        </div>
        <button class="btn btn-primary">Lưu</button>
        <a class="btn btn-secondary" th:href="@{/admin/users}">Hủy</a>
    </form>
</div>
</body>
</html>
