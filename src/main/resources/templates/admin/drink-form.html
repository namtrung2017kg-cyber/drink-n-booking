<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đồ uống')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container py-4" style="max-width:560px">
    <a class="btn btn-outline-secondary mb-3"
       th:href="@{/admin/drinks(page=${returnPage},keyword=${keyword},categoryId=${categoryId})}">← Quay lại danh sách</a>

    <h3 class="mb-3" th:text="${drink.id == null} ? 'Thêm đồ uống' : 'Sửa đồ uống'"></h3>
    <form th:action="@{/admin/drinks/save}" th:object="${drink}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{imageUrl}">
        <input type="hidden" name="page" th:value="${returnPage}">
        <input type="hidden" name="keyword" th:value="${keyword}">
        <input type="hidden" name="categoryId" th:value="${categoryId}">
        <div class="mb-3">
            <label class="form-label">Tên đồ uống</label>
            <input class="form-control" th:field="*{name}">
            <div class="text-danger small" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Loại</label>
            <select class="form-select" th:field="*{category.id}">
                <option value="">-- Chọn loại --</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
            <div class="text-danger small" th:errors="*{category.id}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Giá (đồng)</label>
            <input class="form-control" type="number" th:field="*{price}">
            <div class="text-danger small" th:errors="*{price}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Ảnh đồ uống</label>
            <div class="mb-2" th:if="${drink.imageUrl != null and !#strings.isEmpty(drink.imageUrl)}">
                <img th:src="${drink.imageUrl}" alt="" class="img-thumbnail" style="max-height:160px">
                <div class="form-check mt-1">
                    <input class="form-check-input" type="checkbox" name="removeImage" value="true" id="removeImage">
                    <label class="form-check-label" for="removeImage">Xóa ảnh hiện tại</label>
                </div>
            </div>
            <input class="form-control" type="file" name="imageFile" accept="image/*">
            <div class="form-text">Chọn ảnh từ máy (JPG, PNG, GIF). Không chọn thì giữ nguyên ảnh cũ.</div>
            <div class="text-danger small" th:errors="*{imageUrl}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{available}" id="available">
            <label class="form-check-label" for="available">Đang bán</label>
        </div>
        <button class="btn btn-primary">Lưu</button>
        <a class="btn btn-secondary"
           th:href="@{/admin/drinks(page=${returnPage},keyword=${keyword},categoryId=${categoryId})}">Hủy</a>
    </form>
</div>
</body>
</html>
